<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>ACS Student Chapter</title>


  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background: #020817;

      overflow-x: hidden;
    }


    /* =========================================
       BACKGROUND
    ========================================= */

    .background {

      position: fixed;

      top: -40px;
      left: -40px;
      right: -40px;
      bottom: -40px;

      z-index: -5;

      background-image:
        url("back.jpeg");

      background-size: cover;

      background-position: center center;

      background-repeat: no-repeat;

      filter: blur(5px);

      transform: scale(1.08);

      animation:
        backgroundMove
        20s
        ease-in-out
        infinite
        alternate;
    }


    @keyframes backgroundMove {

      from {
        transform: scale(1.08);
      }

      to {
        transform: scale(1.15);
      }

    }


    /* =========================================
       DARK OVERLAY
    ========================================= */

    .overlay {

      position: fixed;

      inset: 0;

      z-index: -4;

      background:
        linear-gradient(
          180deg,
          rgba(0, 5, 18, 0.62),
          rgba(0, 15, 40, 0.55),
          rgba(0, 0, 0, 0.78)
        );
    }


    /* =========================================
       BLUE LIGHT
    ========================================= */

    .light {

      position: fixed;

      width: 450px;
      height: 450px;

      left: 50%;
      top: -250px;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background:
        rgba(40, 120, 255, 0.18);

      filter: blur(100px);

      z-index: -3;

      pointer-events: none;
    }


    /* =========================================
       MAIN CONTAINER
    ========================================= */

    .container {

      width: 100%;

      max-width: 480px;

      min-height: 100vh;

      margin: 0 auto;

      padding:
        48px
        22px
        25px;

      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;
    }


    /* =========================================
       LOGO
    ========================================= */

    .logo-wrapper {

      position: relative;

      width: 170px;

      height: 170px;

      margin-bottom: 25px;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    /*
      THIS IS THE GLOW CIRCLE

      It is centered using flexbox.
      No animation.
      No transform.
      So it cannot move away from the logo.
    */

    .logo-wrapper::before {

      content: "";

      position: absolute;

      width: 178px;

      height: 178px;

      left: 50%;

      top: 50%;

      margin-left: -89px;

      margin-top: -89px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #7eb3ff,
          #ffffff
        );

      box-shadow:

        0 0 18px
        rgba(100, 170, 255, 0.9),

        0 0 45px
        rgba(50, 130, 255, 0.55);

      z-index: 0;
    }


    /*
      SECOND GLOW
    */

    .logo-wrapper::after {

      content: "";

      position: absolute;

      width: 190px;

      height: 190px;

      left: 50%;

      top: 50%;

      margin-left: -95px;

      margin-top: -95px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255, 255, 255, 0.45);

      box-shadow:
        0 0 35px
        rgba(60, 140, 255, 0.35);

      z-index: 0;
    }


    /* =========================================
       ACS IMAGE
    ========================================= */

    .logo {

      position: relative;

      width: 160px;

      height: 160px;

      object-fit: cover;

      object-position: center;

      border-radius: 50%;

      border:
        5px solid
        white;

      z-index: 2;

      display: block;

      box-shadow:

        0 8px 30px
        rgba(0, 0, 0, 0.45);
    }


    /* =========================================
       TITLE
    ========================================= */

    h1 {

      font-size:
        clamp(26px, 7vw, 34px);

      line-height: 1.15;

      font-weight: 800;

      margin-bottom: 9px;

      letter-spacing: 0.2px;

      text-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.65);
    }


    .subtitle {

      font-size: 15px;

      color:
        rgba(255, 255, 255, 0.82);

      letter-spacing: 0.4px;

      margin-bottom: 28px;
    }


    /* =========================================
       MAIN BUTTON
    ========================================= */

    .button {

      width: 100%;

      min-height: 60px;

      padding:
        15px
        20px;

      margin: 8px 0;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 11px;

      border-radius: 18px;

      text-decoration: none;

      color: white;

      font-size: 17px;

      font-weight: 700;

      letter-spacing: 0.5px;

      border:
        1px solid
        rgba(255, 255, 255, 0.25);

      background:
        rgba(255, 255, 255, 0.12);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.28);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }


    .button:hover {

      transform:
        translateY(-3px);

      background:
        rgba(255, 255, 255, 0.19);

      box-shadow:
        0 15px 38px
        rgba(0, 0, 0, 0.38);
    }


    .button:active {

      transform:
        scale(0.98);
    }


    /* =========================================
       REGISTER BUTTON
    ========================================= */

    .register {

      background:
        linear-gradient(
          135deg,
          #1680ff,
          #0750c9
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.35);

      box-shadow:
        0 10px 35px
        rgba(0, 100, 255, 0.38);
    }


    .register:hover {

      background:
        linear-gradient(
          135deg,
          #2990ff,
          #0758dc
        );

      box-shadow:
        0 15px 42px
        rgba(0, 110, 255, 0.52);
    }


    /* =========================================
       SOCIAL BUTTON
    ========================================= */

    .social-button {

      position: relative;

      cursor: pointer;

      font-family: inherit;
    }


    .arrow {

      position: absolute;

      right: 23px;

      font-size: 20px;

      transition:
        transform 0.3s ease;
    }


    .social-button.active
    .arrow {

      transform:
        rotate(180deg);
    }


    /* =========================================
       SOCIAL LINKS
    ========================================= */

    .social-links {

      width: 100%;

      max-height: 0;

      overflow: hidden;

      opacity: 0;

      transform:
        translateY(-8px);

      transition:
        max-height 0.45s ease,
        opacity 0.3s ease,
        transform 0.3s ease;
    }


    .social-links.show {

      max-height: 330px;

      opacity: 1;

      transform:
        translateY(0);
    }


    .social {

      min-height: 53px;

      font-size: 15px;

      border-radius: 15px;
    }


    /* =========================================
       SOCIAL HOVER
    ========================================= */

    .facebook:hover {

      background:
        rgba(24, 119, 242, 0.72);
    }


    .instagram:hover {

      background:
        linear-gradient(
          90deg,
          rgba(245, 133, 41, 0.78),
          rgba(221, 42, 123, 0.78),
          rgba(129, 52, 175, 0.78)
        );
    }


    .tiktok:hover {

      background:
        rgba(0, 0, 0, 0.72);
    }


    .linkedin:hover {

      background:
        rgba(10, 102, 194, 0.78);
    }


    /* =========================================
       FOOTER
    ========================================= */

    .footer {

      margin-top: auto;

      padding-top: 35px;

      color:
        rgba(255, 255, 255, 0.55);

      font-size: 12px;

      letter-spacing: 0.4px;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 500px) {

      .container {

        padding-top: 40px;

        padding-left: 18px;

        padding-right: 18px;
      }


      .logo-wrapper {

        width: 150px;

        height: 150px;
      }


      .logo-wrapper::before {

        width: 158px;

        height: 158px;

        margin-left: -79px;

        margin-top: -79px;
      }


      .logo-wrapper::after {

        width: 170px;

        height: 170px;

        margin-left: -85px;

        margin-top: -85px;
      }


      .logo {

        width: 140px;

        height: 140px;
      }


      h1 {

        font-size: 27px;
      }


      .subtitle {

        margin-bottom: 22px;
      }


      .button {

        min-height: 58px;
      }

    }


    /* =========================================
       ACCESSIBILITY
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      .background {

        animation: none;
      }

      .button {

        transition: none;
      }

    }

  </style>

</head>


<body>


  <!-- BACKGROUND -->

  <div class="background"></div>

  <div class="overlay"></div>

  <div class="light"></div>


  <!-- CONTENT -->

  <main class="container">


    <!-- ACS LOGO -->

    <div class="logo-wrapper">

      <img
        class="logo"
        src="acs.jpeg.jpeg"
        alt="ACS Student Chapter">

    </div>


    <!-- TITLE -->

    <h1>
      ACS Student Chapter
    </h1>


    <p class="subtitle">
      Ain Shams University
    </p>


    <!-- REGISTER -->

    <a
      class="button register"
      href="PUT_REGISTER_LINK_HERE"
      target="_blank"
      rel="noopener noreferrer">

      <span>📝</span>

      <span>REGISTER NOW</span>

    </a>


    <!-- SOCIAL MEDIA -->

    <button
      class="button social-button"
      id="socialButton"
      type="button">

      <span>🌐</span>

      <span>SOCIAL MEDIA</span>

      <span class="arrow">⌄</span>

    </button>


    <!-- SOCIAL LINKS -->

    <div
      class="social-links"
      id="socialLinks">


      <!-- FACEBOOK -->

      <a
        class="button social facebook"
        href="https://www.facebook.com/share/1WGXzNVfxr/"
        target="_blank"
        rel="noopener noreferrer">

        <span>📘</span>

        <span>Facebook</span>

      </a>


      <!-- INSTAGRAM -->

      <a
        class="button social instagram"
        href="https://www.instagram.com/acs672019?igsi=MTZyYjF4eHJ0ZjRpYQ=="
        target="_blank"
        rel="noopener noreferrer">

        <span>📸</span>

        <span>Instagram</span>

      </a>


      <!-- TIKTOK -->

      <a
        class="button social tiktok"
        href="https://www.tiktok.com/@acs0775?_r=1&_t=ZS-99SIyQQvjaH"
        target="_blank"
        rel="noopener noreferrer">

        <span>🎵</span>

        <span>TikTok</span>

      </a>


      <!-- LINKEDIN -->

      <a
        class="button social linkedin"
        href="https://www.linkedin.com/company/acschapter/"
        target="_blank"
        rel="noopener noreferrer">

        <span>💼</span>

        <span>LinkedIn</span>

      </a>


    </div>


    <!-- FOOTER -->

    <div class="footer">

      © 2026 ACS Student Chapter

    </div>


  </main>


  <!-- JAVASCRIPT -->

  <script>

    const socialButton =
      document.getElementById("socialButton");

    const socialLinks =
      document.getElementById("socialLinks");


    socialButton.addEventListener(
      "click",
      function () {

        socialButton.classList.toggle(
          "active"
        );

        socialLinks.classList.toggle(
          "show"
        );

      }
    );

  </script>


</body>

</html>
