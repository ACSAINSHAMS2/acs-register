<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACS Student Chapter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: #050914;
      overflow-x: hidden;
    }

    /* Background */
    .background {
      position: fixed;
      inset: -30px;
      z-index: -3;

      background-image: url("back.jpeg");
      background-size: cover;
      background-position: center;

      filter: blur(7px);
      transform: scale(1.08);

      animation: zoom 18s ease-in-out infinite alternate;
    }

    @keyframes zoom {
      from {
        transform: scale(1.08);
      }

      to {
        transform: scale(1.18);
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: -2;

      background:
        linear-gradient(
          180deg,
          rgba(0, 5, 20, .72),
          rgba(0, 12, 35, .58),
          rgba(0, 0, 0, .84)
        );
    }

    /* Main */
    .container {
      width: 100%;
      max-width: 470px;
      min-height: 100vh;

      margin: auto;
      padding: 50px 22px 30px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* Logo */
    .logo-wrapper {
      position: relative;
      width: 165px;
      height: 165px;
      margin-bottom: 25px;
    }

    .logo-ring {
      position: absolute;
      inset: -5px;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        white,
        #69a4ff,
        white
      );

      animation: rotate 8s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .logo {
      position: absolute;
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;
      border: 5px solid white;

      box-shadow:
        0 0 30px rgba(60, 140, 255, .55),
        0 12px 40px rgba(0, 0, 0, .45);
    }

    /* Title */
    h1 {
      font-size: 31px;
      line-height: 1.15;
      font-weight: 800;

      margin-bottom: 9px;

      text-shadow:
        0 3px 15px rgba(0,0,0,.5);
    }

    .subtitle {
      color: rgba(255,255,255,.78);
      font-size: 15px;

      margin-bottom: 28px;
    }

    /* Buttons */
    .button {
      width: 100%;
      min-height: 60px;

      margin: 8px 0;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;

      border-radius: 18px;

      text-decoration: none;
      color: white;

      font-size: 17px;
      font-weight: 700;

      border: 1px solid rgba(255,255,255,.22);

      background: rgba(255,255,255,.12);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 10px 30px rgba(0,0,0,.25);

      transition: .25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.2);
    }

    .register {
      background:
        linear-gradient(
          135deg,
          rgba(20,113,255,.96),
          rgba(0,67,190,.94)
        );

      box-shadow:
        0 10px 35px rgba(0,87,255,.35);
    }

    .register:hover {
      box-shadow:
        0 15px 40px rgba(0,102,255,.5);
    }

    /* Social button */
    .social-button {
      position: relative;
      cursor: pointer;
      font-family: inherit;
    }

    .arrow {
      position: absolute;
      right: 22px;
      font-size: 20px;

      transition: transform .3s ease;
    }

    .social-button.active .arrow {
      transform: rotate(180deg);
    }

    /* Social links */
    .social-links {
      width: 100%;

      max-height: 0;
      overflow: hidden;

      opacity: 0;
      transform: translateY(-10px);

      transition:
        max-height .5s ease,
        opacity .35s ease,
        transform .35s ease;
    }

    .social-links.show {
      max-height: 330px;

      opacity: 1;
      transform: translateY(0);
    }

    .social {
      min-height: 53px;
      font-size: 15px;
      border-radius: 15px;
    }

    .facebook:hover {
      background: rgba(24,119,242,.7);
    }

    .instagram:hover {
      background:
        linear-gradient(
          90deg,
          rgba(245,133,41,.75),
          rgba(221,42,123,.75),
          rgba(129,52,175,.75)
        );
    }

    .tiktok:hover {
      background: rgba(0,0,0,.7);
    }

    .linkedin:hover {
      background: rgba(10,102,194,.75);
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding-top: 35px;

      color: rgba(255,255,255,.55);
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .container {
        padding-top: 40px;
      }

      .logo-wrapper {
        width: 145px;
        height: 145px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <main class="container">

    <!-- ACS Logo -->
    <div class="logo-wrapper">
      <div class="logo-ring"></div>

      <img
        class="logo"
        src="acs.jpeg.jpeg"
        alt="ACS Student Chapter">
    </div>

    <!-- Title -->
    <h1>ACS Student Chapter</h1>

    <p class="subtitle">
      Ain Shams University
    </p>

    <!-- Register -->
    <a
      class="button register"
      href="PUT_REGISTER_LINK_HERE"
      target="_blank"
      rel="noopener noreferrer">

      📝
      <span>REGISTER NOW</span>

    </a>

    <!-- Social Media -->
    <button
      class="button social-button"
      id="socialButton"
      type="button">

      🌐
      <span>SOCIAL MEDIA</span>

      <span class="arrow">⌄</span>

    </button>

    <!-- Social Links -->
    <div
      class="social-links"
      id="socialLinks">

      <a
        class="button social facebook"
        href="https://www.facebook.com/share/1WGXzNVfxr/"
        target="_blank"
        rel="noopener noreferrer">

        📘
        <span>Facebook</span>

      </a>

      <a
        class="button social instagram"
        href="https://www.instagram.com/acs672019?igsi=MTZyYjF4eHJ0ZjRpYQ=="
        target="_blank"
        rel="noopener noreferrer">

        📸
        <span>Instagram</span>

      </a>

      <a
        class="button social tiktok"
        href="https://www.tiktok.com/@acs0775?_r=1&_t=ZS-99SIyQQvjaH"
        target="_blank"
        rel="noopener noreferrer">

        🎵
        <span>TikTok</span>

      </a>

      <a
        class="button social linkedin"
        href="https://www.linkedin.com/company/acschapter/"
        target="_blank"
        rel="noopener noreferrer">

        💼
        <span>LinkedIn</span>

      </a>

    </div>

    <div class="footer">
      © 2026 ACS Student Chapter
    </div>

  </main>

  <script>

    const socialButton =
      document.getElementById("socialButton");

    const socialLinks =
      document.getElementById("socialLinks");

    socialButton.addEventListener("click", function () {

      socialButton.classList.toggle("active");

      socialLinks.classList.toggle("show");

    });

  </script>

</body>
</html>
